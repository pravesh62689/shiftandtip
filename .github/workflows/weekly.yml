name: Weekly Maintenance & Health Audit

on:
  schedule:
    - cron: '30 3 * * 1'   # weekly Monday 03:30 UTC
    - cron: '0 4 1 * *'    # monthly 1st at 04:00 UTC — re-capture pending states/cities
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  token-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Check OAuth refresh token health
        id: auth
        continue-on-error: true
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: node scripts/verify-blogger-auth.mjs
      - name: Open re-auth issue on invalid_grant / failure
        if: steps.auth.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh issue list --state open --search "Re-auth needed: run npm run reauth in:title" --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            gh issue create --title "Re-auth needed: run npm run reauth" --body "OAuth refresh failed in weekly.yml. Run \`npm run reauth\` locally and click Allow twice (Main + FileBrik profiles)."
          fi
          exit 1

  weekly-audit:
    needs: token-health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run unit test suite
        run: npm test

      - name: Verify Blogger API authorization
        run: node scripts/verify-blogger-auth.mjs
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}

      - name: Monthly re-capture pending state taxes and city wages
        if: github.event.schedule == '0 4 1 * *' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Re-capturing 38 pending state tax tables and 36 cities from .gov pages..."
          node scripts/pw/capture-tax-and-cities.mjs --pending-only 2>&1 || true
          node scripts/audit-tax-city-data.mjs
          node scripts/auto-schedule-verified.mjs 2>&1 || echo "No new pages to schedule"
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}

      - name: Recheck statutory wage and overtime data
        run: node scripts/recheck-data.mjs

      - name: Live QA sample (5 URLs)
        run: node scripts/pw/live-qa.mjs --sample 5

      - name: Lighthouse mobile audit (3 URLs)
        run: node scripts/pw/run-lighthouse.mjs

      - name: Track AdSense readiness
        run: node scripts/track-adsense.mjs
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}

      - name: Commit updated reports and verified data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ docs/manual-steps.md docs/publish-schedule.md data/state-taxes.json data/cities.json data/raw/
          git checkout -- .
          if git diff --staged --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore(audit): update weekly reports and monthly verified data [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Open GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Weekly Health Audit Failure: ${new Date().toISOString().slice(0, 10)}`;
            const body = `### Automated Weekly Run Failed\n\nThe scheduled weekly maintenance workflow encountered an error.\n\n- **Run ID**: ${context.runId}\n- **Workflow Run**: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- **Triggered By**: ${context.eventName}\n\nPlease check the workflow logs, review any failing data checks or authentication expiry, and address promptly.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'automated-audit']
            });
