name: Publish to Blogger

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Publish action to execute'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - 'dry-run'
          - 'confirm-drafts'
          - 'publish'
          - 'patch-titles'
          - 'update'

permissions:
  contents: write

jobs:
  publish-to-blogger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build posts and assets
        run: |
          npm run build
          npm run build:posts

      - name: Inject Blogger OAuth secrets
        env:
          CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        run: |
          mkdir -p secrets
          echo "$CLIENT_SECRET" > secrets/client_secret.json
          echo "$TOKEN_JSON" > secrets/token.json

      - name: Execute publish-blogger.mjs
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
        run: |
          case "${{ inputs.action }}" in
            "dry-run")
              node scripts/publish-blogger.mjs
              ;;
            "confirm-drafts")
              node scripts/publish-blogger.mjs --confirm
              ;;
            "publish")
              node scripts/publish-blogger.mjs --publish --confirm
              ;;
            "patch-titles")
              node scripts/publish-blogger.mjs --patch-titles --confirm
              ;;
            "update")
              node scripts/publish-blogger.mjs --update --confirm
              ;;
          esac

      - name: Commit published posts registry
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --ignore-missing dist/posts/published.json data/live-urls.json
          if git diff --staged --quiet; then
            echo "No published registry changes to commit."
          else
            git commit -m "chore(publish): record published blogger posts & pages [skip ci]"
            git push
          fi
